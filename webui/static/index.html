<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EDIATH Web UI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container">
    <h1>EDIATH Control Panel</h1>
    <div id="status" class="card">Loading status...</div>

    <div class="controls card">
      <button id="btn-initialize">Initialize</button>
      <button id="btn-run">Run</button>
      <button id="btn-shutdown">Shutdown</button>
    </div>

    <div class="agents card">
      <h3>Agents</h3>
      <ul id="agents-list"></ul>
    </div>

    <div class="execute card">
      <h3>Execute Command</h3>
      <textarea id="cmd-text" rows="4" placeholder="Command text..."></textarea>
      <button id="btn-exec">Execute</button>
      <pre id="exec-result"></pre>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
