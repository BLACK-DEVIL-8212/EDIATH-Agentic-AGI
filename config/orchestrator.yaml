# EDIATH Orchestrator Configuration
# Version: 2.0.0
# Last Updated: 2026-04-22

# =========================
# BASIC INFORMATION
# =========================

name: "EDIATH_Orchestrator"
version: "2.0.0"
environment: "production"  # Options: development, staging, production, testing

# Instance identification
instance_id: null  # Auto-generated if null
instance_name: "ediath-main"
deployment_id: null

# =========================
# TIMING CONFIGURATIONS
# =========================

timing:
  # Core timing
  tick_interval_ms: 100  # Main loop tick interval (milliseconds)
  health_check_interval_sec: 30  # Health check frequency (seconds)
  metrics_flush_interval_sec: 60  # Metrics flush interval (seconds)
  circuit_breaker_threshold: 5  # Failures before circuit opens
  
  # Additional timing
  heartbeat_interval_sec: 10
  task_cleanup_interval_sec: 300
  cache_cleanup_interval_sec: 600
  log_rotation_interval_sec: 86400  # 24 hours
  
  # Timeouts
  timeouts:
    component_startup_sec: 30
    component_shutdown_sec: 30
    task_execution_sec: 300
    api_request_sec: 60
    database_operation_sec: 10
    file_operation_sec: 30
    network_request_sec: 30
    lock_acquisition_sec: 5
  
  # Retry configurations
  retry:
    max_retries: 3
    retry_delay_sec: 5
    retry_backoff_multiplier: 2.0
    max_retry_delay_sec: 60
    
    retryable_errors:
      - "ConnectionError"
      - "TimeoutError"
      - "ResourceUnavailable"
      - "RateLimitExceeded"
  
  # Recovery
  recovery:
    recovery_timeout_sec: 30
    recovery_attempts: 3
    recovery_cooldown_sec: 60
    auto_restart: true
    auto_restart_delay_sec: 10
    max_auto_restarts_per_hour: 5

# =========================
# PATHS AND DIRECTORIES
# =========================

paths:
  # Base directories
  base_dir: "."  # Application root
  log_dir: "logs"
  config_dir: "config"
  data_dir: "data"
  
  # EDIATH specific directories
  reports_dir: "research"
  workspace_dir: "workspace"
  generated_projects_dir: "generated_projects"
  
  # Additional directories
  models_dir: "models"
  cache_dir: "cache"
  temp_dir: "temp"
  backup_dir: "backups"
  plugins_dir: "plugins"
  assets_dir: "assets"
  
  # API directories
  api_dir: "api"
  core_dir: "core"
  utils_dir: "core/utils"
  
  # Security directories
  security_dir: "security"
  certificates_dir: "security/certs"
  keys_dir: "security/keys"
  
  # Data subdirectories
  memory_dir: "data/memory"
  metrics_dir: "data/metrics"
  task_queue_dir: "data/task_queue"
  knowledge_base_dir: "data/knowledge_base"
  workflow_checkpoints_dir: "data/workflow_checkpoints"
  
  # Media directories
  screenshots_dir: "screenshots"
  recordings_dir: "recordings"
  audio_outputs_dir: "audio_outputs"
  downloads_dir: "downloads"
  
  # Permissions
  permissions:
    require_writable: true
    default_permissions: 0o755
    file_permissions: 0o644
    dir_permissions: 0o755

# =========================
# FEATURE FLAGS
# =========================

features:
  # Core features
  enable_autonomous_mode: true
  enable_learning: true
  enable_memory: false  # Zero-Crash: Disable Mongo timeouts
  enable_security: true
  enable_vision: false
  enable_audio: false
  
  # Additional features
  enable_alerts: true
  enable_metrics: true
  enable_persistence: false  # Skip JSON writes if memory off
  enable_logging: true
  enable_monitoring: true
  enable_profiling: false
  enable_debug: false
  
  # Advanced features
  enable_distributed_mode: false
  enable_async_processing: true
  enable_batch_processing: true
  enable_streaming: false
  enable_websocket: false
  enable_grpc: false
  enable_graphql: false
  
  # Experimental features
  experimental:
    enable_edge_computing: false
    enable_federated_learning: false
    enable_blockchain_integration: false
    enable_quantum_computing: false

# =========================
# COMPONENT CONFIGURATIONS
# =========================

components:
  # LLM Component
  llm:
    enabled: true
    model_path: "models/EDIATH-q4_k_m.gguf"
    model_type: "gguf"  # Options: gguf, pytorch, tensorflow, onnx
    device: "auto"  # Options: cpu, cuda, mps, auto
    precision: "float16"  # Options: float32, float16, int8, int4
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    
    # Performance
    batch_size: 1
    max_concurrent_requests: 10
    request_queue_size: 100
    cache_enabled: true
    cache_size: 1000
    
    # Fallback
    fallback_model: null
  
  # Memory Component
  memory:
    enabled: false  # Zero-Crash: Disable Mongo timeouts
    backend: "memory"  # Options: memory, mongodb, postgresql, redis, hybrid
    connection_string: null
    database_name: "ediath_memory"
    
    # Memory types
    short_term_capacity: 1000
    long_term_capacity: 100000
    working_memory_capacity: 50
    
    # Caching
    cache_enabled: true
    cache_ttl_seconds: 300
    cache_max_size: 1000
    
    # Vector memory
    vector_enabled: false
    vector_dimension: 1536
    similarity_metric: "cosine"  # Options: cosine, euclidean, dot_product
  
  # Learning Component
  learning:
    enabled: false  # Dependent on memory
    backend: "online"  # Options: online, batch, hybrid
    
    # Learning types
    reinforcement_enabled: true
    supervised_enabled: true
    unsupervised_enabled: true
    transfer_enabled: false
    
    # Learning parameters
    learning_rate: 0.001
    batch_size: 32
    epochs: 10
    validation_split: 0.1
    
    # Model storage
    model_dir: "models/learning"
    auto_save: true
    save_interval_seconds: 300
  
  # Security Component
  security:
    enabled: true
    
    # Authentication
    auth_enabled: true
    auth_backend: "jwt"  # Options: jwt, oauth2, ldap
    jwt_secret_key: null  # Generate if null
    jwt_expiry_seconds: 86400  # 24 hours
    
    # Authorization
    rbac_enabled: true
    permission_file: "config/permissions.yaml"
    
    # Encryption
    encryption_enabled: true
    encryption_algorithm: "AES-256-GCM"
    encryption_key_path: "security/keys/master.key"
    
    # Input validation
    input_sanitization: true
    sql_injection_prevention: true
    xss_prevention: true
    
    # Rate limiting
    rate_limiting_enabled: true
    rate_limit_requests_per_minute: 60
    rate_limit_burst: 10
    
    # Audit logging
    audit_log_enabled: true
    audit_log_file: "logs/audit.log"
    audit_log_events:
      - "authentication"
      - "authorization"
      - "data_access"
      - "configuration_change"
      - "system_action"
  
  # Vision Component
  vision:
    enabled: false
    backend: "opencv"  # Options: opencv, pytorch, tensorflow
    camera_id: 0
    camera_fps: 30
    camera_resolution: [640, 480]
    
    # Detection models
    face_detection_model: "haarcascade"
    object_detection_model: "yolov8"
    ocr_model: "tesseract"
    
    # Processing
    frame_processing_interval_ms: 100
    enable_motion_detection: true
    enable_face_recognition: false
    enable_object_tracking: false
    
    # Storage
    save_frames: false
    frame_storage_dir: "data/frames"
    max_stored_frames: 1000
  
  # Audio Component
  audio:
    enabled: false
    backend: "sounddevice"  # Options: sounddevice, pyaudio, portaudio
    
    # Input
    input_device: null  # Auto-detect
    sample_rate: 16000
    channels: 1
    chunk_size: 1024
    
    # Output
    output_device: null
    output_sample_rate: 44100
    output_channels: 2
    
    # Speech recognition
    stt_enabled: true
    stt_engine: "whisper"  # Options: whisper, google, azure
    stt_model: "base"
    stt_language: "en-US"
    
    # Text-to-speech
    tts_enabled: true
    tts_engine: "pyttsx3"
    tts_voice: "default"
    tts_rate: 150
    
    # Wake word detection
    wakeword_enabled: false
    wakeword_model: "hey_computer"
    wakeword_sensitivity: 0.5
    
    # Processing
    vad_enabled: true
    noise_filtering: true
    echo_cancellation: true
  
  # Automation Component
  automation:
    enabled: true
    browser_enabled: true
    browser_driver: "chrome"
    browser_headless: false
    
    # Web automation
    default_timeout_seconds: 30
    max_concurrent_browsers: 5
    screenshot_on_error: true
    save_page_source_on_error: true
    
    # API automation
    api_timeout_seconds: 30
    max_concurrent_requests: 20
    default_retry_attempts: 3
    
    # Task automation
    task_queue_enabled: true
    max_concurrent_tasks: 10
    task_timeout_seconds: 300
    task_retry_attempts: 3

# =========================
# ORCHESTRATOR SETTINGS
# =========================

orchestrator:
  # Mode
  mode: "single"  # Options: single, master, worker, hybrid
  
  # Worker configuration (for distributed mode)
  workers:
    min_workers: 1
    max_workers: 10
    worker_spawn_delay_sec: 1
    worker_heartbeat_interval_sec: 10
    worker_timeout_sec: 60
  
  # Task scheduling
  scheduling:
    algorithm: "priority_queue"  # Options: fifo, priority, round_robin, weighted_fair
    max_queue_size: 1000
    queue_persistence: true
    preemptive_scheduling: true
    
    priority_levels:
      - name: "critical"
        level: 0
        weight: 1.0
      
      - name: "high"
        level: 1
        weight: 0.8
      
      - name: "normal"
        level: 2
        weight: 0.5
      
      - name: "low"
        level: 3
        weight: 0.3
      
      - name: "background"
        level: 4
        weight: 0.1
  
  # Load balancing
  load_balancing:
    enabled: true
    algorithm: "least_loaded"  # Options: round_robin, least_loaded, random, weighted
    check_interval_sec: 5
    rebalance_threshold: 0.3
  
  # Resource management
  resources:
    cpu_limit_percent: 80
    memory_limit_mb: 4096
    disk_limit_gb: 50
    network_limit_mbps: 100
    
    monitoring:
      enabled: true
      check_interval_sec: 10
      alert_threshold_percent: 90
  
  # State management
  state:
    persistence_enabled: true
    persistence_interval_sec: 30
    persistence_backend: "file"  # Options: file, database, redis
    state_file: "data/orchestrator_state.json"
    
    recovery:
      enabled: true
      auto_recover: true
      checkpoint_interval_sec: 60

# =========================
# CIRCUIT BREAKER
# =========================

circuit_breaker:
  # Global settings
  enabled: true
  default_threshold: 5  # Failures before opening
  default_timeout_sec: 30  # Time before attempting reset
  default_half_open_max_calls: 3  # Max calls in half-open state
  
  # Per-component thresholds
  components:
    llm:
      threshold: 5
      timeout_sec: 60
      half_open_max_calls: 3
    
    memory:
      threshold: 3
      timeout_sec: 10
      half_open_max_calls: 2
    
    automation:
      threshold: 5
      timeout_sec: 30
      half_open_max_calls: 3
    
    vision:
      threshold: 3
      timeout_sec: 15
      half_open_max_calls: 2
    
    audio:
      threshold: 3
      timeout_sec: 15
      half_open_max_calls: 2
  
  # Monitoring
  monitoring:
    enabled: true
    log_state_changes: true
    metrics_collection: true
    alert_on_open: true

# =========================
# HEALTH CHECK
# =========================

health_check:
  # General settings
  enabled: true
  interval_sec: 30
  timeout_sec: 10
  
  # Component health checks
  components:
    llm:
      enabled: true
      check_method: "generate"  # Options: ping, generate, custom
      expected_response_time_ms: 1000
    
    memory:
      enabled: false  # Disabled with memory
      check_method: "ping"
      expected_response_time_ms: 100
    
    automation:
      enabled: true
      check_method: "ping"
      expected_response_time_ms: 500
    
    security:
      enabled: true
      check_method: "ping"
      expected_response_time_ms: 100
    
    vision:
      enabled: false
      check_method: "ping"
      expected_response_time_ms: 500
    
    audio:
      enabled: false
      check_method: "ping"
      expected_response_time_ms: 500
  
  # System health checks
  system:
    disk_space:
      enabled: true
      min_free_gb: 1
      check_interval_sec: 300
    
    memory:
      enabled: true
      min_free_mb: 500
      check_interval_sec: 60
    
    cpu:
      enabled: true
      max_load_percent: 90
      check_interval_sec: 60
    
    network:
      enabled: true
      check_endpoints: ["8.8.8.8", "1.1.1.1"]
      timeout_sec: 5
      check_interval_sec: 300
  
  # Health status endpoints
  endpoints:
    http:
      enabled: true
      port: 8080
      path: "/health"
      auth_required: false
    
    grpc:
      enabled: false
      port: 9090
    
    metrics:
      enabled: true
      port: 9091
      path: "/metrics"

# =========================
# LOGGING CONFIGURATION
# =========================

logging:
  # General settings
  enabled: true
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # Options: text, json
  
  # Log outputs
  outputs:
    console:
      enabled: true
      level: "INFO"
      colorized: true
    
    file:
      enabled: true
      path: "logs/ediath.log"
      level: "DEBUG"
      max_size_mb: 100
      backup_count: 10
      compress: true
    
    syslog:
      enabled: false
      host: "localhost"
      port: 514
      protocol: "udp"  # Options: udp, tcp
    
    elasticsearch:
      enabled: false
      hosts: ["localhost:9200"]
      index: "ediath-logs"
      level: "INFO"
  
  # Component-specific logging
  components:
    orchestrator:
      level: "INFO"
      separate_file: false
    
    llm:
      level: "INFO"
      separate_file: true
      file_path: "logs/llm.log"
    
    memory:
      level: "WARNING"
      separate_file: true
      file_path: "logs/memory.log"
    
    automation:
      level: "INFO"
      separate_file: true
      file_path: "logs/automation.log"
    
    security:
      level: "INFO"
      separate_file: true
      file_path: "logs/security.log"
  
  # Log rotation
  rotation:
    enabled: true
    max_size_mb: 100
    backup_count: 10
    compress: true
    rotate_on_startup: true
  
  # Log retention
  retention:
    enabled: true
    max_days: 30
    max_size_gb: 10
    delete_old: true

# =========================
# METRICS CONFIGURATION
# =========================

metrics:
  # General settings
  enabled: true
  flush_interval_sec: 60
  
  # Metrics collection
  collection:
    system_metrics: true
    component_metrics: true
    business_metrics: true
    custom_metrics: true
    
    collection_interval_sec: 10
    aggregation_intervals:
      - "1m"
      - "5m"
      - "1h"
      - "1d"
  
  # Metrics storage
  storage:
    backend: "file"  # Options: file, influxdb, prometheus, datadog
    retention_days: 30
    
    file_backend:
      path: "data/metrics"
      format: "json"  # Options: json, csv, parquet
    
    influxdb:
      url: "http://localhost:8086"
      token: null
      org: "ediath"
      bucket: "metrics"
  
  # Metrics export
  export:
    prometheus:
      enabled: true
      port: 9090
      path: "/metrics"
    
    statsd:
      enabled: false
      host: "localhost"
      port: 8125
      prefix: "ediath"
  
  # Business metrics
  business_metrics:
    - "tasks_completed"
    - "task_success_rate"
    - "average_task_duration"
    - "memory_usage"
    - "llm_requests_count"
    - "llm_tokens_used"
    - "automation_actions"
    - "user_satisfaction_score"
  
  # Alerts
  alerts:
    enabled: true
    check_interval_sec: 30
    
    rules:
      - name: "high_error_rate"
        metric: "task_success_rate"
        condition: "< 0.8"
        severity: "warning"
      
      - name: "high_memory_usage"
        metric: "memory_usage_percent"
        condition: "> 90"
        severity: "critical"
      
      - name: "high_cpu_usage"
        metric: "cpu_usage_percent"
        condition: "> 90"
        severity: "warning"

# =========================
# PERFORMANCE OPTIMIZATION
# =========================

performance:
  # Caching
  caching:
    enabled: true
    default_ttl_sec: 300
    
    caches:
      llm_cache:
        max_size: 1000
        ttl_sec: 3600
      
      memory_cache:
        max_size: 10000
        ttl_sec: 300
      
      automation_cache:
        max_size: 500
        ttl_sec: 600
  
  # Connection pooling
  connection_pooling:
    enabled: true
    max_size: 20
    min_size: 5
    max_idle_time_sec: 300
  
  # Threading
  threading:
    max_workers: 10
    thread_pool_size: 20
    task_queue_size: 100
  
  # Asynchronous processing
  async_processing:
    enabled: true
    max_concurrent_tasks: 50
    task_timeout_sec: 30
  
  # Batching
  batching:
    enabled: true
    max_batch_size: 100
    batch_timeout_ms: 100
  
  # Compression
  compression:
    enabled: true
    algorithm: "lz4"  # Options: gzip, lz4, zstd, snappy
    level: 1  # 1-9 (fast to best)
    min_size_bytes: 1024

# =========================
# ERROR HANDLING
# =========================

error_handling:
  # Global error handling
  enabled: true
  log_errors: true
  notify_on_error: true
  error_threshold: 100  # Errors before notification
  
  # Error categories
  categories:
    recoverable:
      - "TimeoutError"
      - "ConnectionError"
      - "RateLimitExceeded"
      action: "retry"
    
    partial:
      - "ValidationError"
      - "ConfigurationError"
      action: "degrade"
    
    fatal:
      - "MemoryError"
      - "SystemError"
      - "CriticalFailure"
      action: "shutdown"
  
  # Error escalation
  escalation:
    enabled: true
    max_retries: 3
    escalation_path:
      - "local_retry"
      - "alternative_component"
      - "fallback_mode"
      - "human_operator"
  
  # Error recovery
  recovery:
    auto_recovery: true
    recovery_attempts: 3
    recovery_cooldown_sec: 60
    state_rollback: true
  
  # Error reporting
  reporting:
    enabled: true
    methods:
      - "log"
      - "metric"
      - "alert"
      - "webhook"
    
    webhook_url: null
    include_stack_trace: true

# =========================
# SECURITY CONFIGURATION
# =========================

security:
  # API security
  api:
    api_key_required: false
    api_key_header: "X-API-Key"
    api_keys: []  # List of valid API keys
    
    rate_limiting:
      enabled: true
      requests_per_minute: 60
      burst: 10
    
    cors:
      enabled: true
      allowed_origins: ["*"]
      allowed_methods: ["GET", "POST", "PUT", "DELETE"]
      allowed_headers: ["*"]
  
  # Data security
  data:
    encryption_at_rest: true
    encryption_key_rotation_days: 90
    data_masking_enabled: true
    pii_redaction: true
    
    sensitive_data_patterns:
      - "email"
      - "phone"
      - "credit_card"
      - "ssn"
  
  # Network security
  network:
    tls_enabled: false
    tls_cert_path: null
    tls_key_path: null
    
    allowed_ips: []
    blocked_ips: []
  
  # Audit trail
  audit:
    enabled: true
    log_all_actions: true
    log_sensitive_operations: true
    audit_retention_days: 90
    audit_export_enabled: true

# =========================
# INTEGRATION SETTINGS
# =========================

integration:
  # External APIs
  external_apis:
    openai:
      enabled: false
      api_key: null
      base_url: "https://api.openai.com/v1"
      timeout_sec: 60
    
    anthropic:
      enabled: false
      api_key: null
      base_url: "https://api.anthropic.com"
      timeout_sec: 60
    
    google:
      enabled: false
      api_key: null
      timeout_sec: 30
  
  # Message queue
  message_queue:
    enabled: false
    type: "redis"  # Options: redis, rabbitmq, kafka
    host: "localhost"
    port: 6379
    queue_prefix: "ediath"
  
  # Database connections
  databases:
    mongodb:
      enabled: false
      uri: null
      database: "ediath"
      pool_size: 10
    
    postgresql:
      enabled: false
      host: "localhost"
      port: 5432
      database: "ediath"
      username: null
      password: null
    
    redis:
      enabled: false
      host: "localhost"
      port: 6379
      db: 0
      password: null
  
  # Webhooks
  webhooks:
    enabled: false
    endpoints: []
    retry_attempts: 3
    timeout_sec: 10

# =========================
# MAINTENANCE MODE
# =========================

maintenance:
  # Maintenance settings
  enabled: false
  mode: "scheduled"  # Options: scheduled, manual, automatic
  
  # Scheduled maintenance
  schedule:
    enabled: false
    cron_expression: "0 2 * * 0"  # Sunday at 2 AM
    duration_hours: 4
  
  # Maintenance tasks
  tasks:
    - "cleanup_logs"
    - "cleanup_cache"
    - "backup_data"
    - "optimize_database"
    - "rotate_keys"
  
  # Graceful shutdown
  graceful_shutdown:
    enabled: true
    timeout_sec: 30
    complete_running_tasks: true
    drain_queues: true

# =========================
# BACKUP AND RECOVERY
# =========================

backup:
  # Backup settings
  enabled: true
  interval_hours: 24
  retention_days: 30
  
  # Backup targets
  targets:
    - "config"
    - "data"
    - "models"
    - "logs"
  
  # Backup locations
  locations:
    local:
      enabled: true
      path: "backups"
      max_backups: 10
    
    remote:
      enabled: false
      type: "s3"  # Options: s3, gcs, azure
      bucket: "ediath-backups"
      region: "us-east-1"
      access_key: null
      secret_key: null
  
  # Backup compression
  compression:
    enabled: true
    algorithm: "gzip"
    level: 6
  
  # Recovery
  recovery:
    auto_recovery: false
    recovery_point: "latest"  # Options: latest, specific
    validation_before_recovery: true

# =========================
# DEBUG AND PROFILING
# =========================

debug:
  # Debug mode
  enabled: false
  verbose: false
  
  # Profiling
  profiling:
    enabled: false
    profiler: "cprofile"  # Options: cprofile, pyinstrument, memory_profiler
    output_dir: "profiles"
    save_flamegraphs: true
  
  # Tracing
  tracing:
    enabled: false
    trace_level: "info"  # Options: debug, info, verbose
    trace_output: "logs/trace.log"
    include_timestamps: true
  
  # Interactive debugging
  interactive:
    enabled: false
    port: 5678  # Debugger port
    wait_for_client: false
  
  # Performance testing
  performance_testing:
    enabled: false
    benchmark_interval_sec: 60
    save_benchmarks: true
    compare_with_baseline: true

# =========================
# DEPLOYMENT SPECIFIC
# =========================

deployment:
  # Deployment type
  type: "standalone"  # Options: standalone, docker, kubernetes, cloud
  
  # Docker settings
  docker:
    container_name: "ediath"
    image: "ediath:latest"
    network: "bridge"
    restart_policy: "unless-stopped"
  
  # Kubernetes settings
  kubernetes:
    namespace: "ediath"
    deployment_name: "ediath-orchestrator"
    replicas: 1
    service_type: "ClusterIP"
  
  # Cloud settings
  cloud:
    provider: "none"  # Options: aws, gcp, azure, none
    region: "us-east-1"
    instance_type: "t3.large"
  
  # Environment variables
  environment_variables:
    load_from_file: true
    env_file: ".env"
    override_with_system: true