# Audio/Speech Configuration
# Version: 2.0.0
# Last Updated: 2026-04-22

# =========================
# GLOBAL AUDIO SETTINGS
# =========================

audio:
  # Master enable/disable
  enabled: true
  
  # Default audio format
  default_format: "wav"  # Options: wav, mp3, ogg, flac, raw
  
  # Audio quality presets
  quality_presets:
    low:
      sample_rate: 8000
      bitrate: 32000
      channels: 1
    medium:
      sample_rate: 16000
      bitrate: 64000
      channels: 1
    high:
      sample_rate: 44100
      bitrate: 128000
      channels: 2
    studio:
      sample_rate: 48000
      bitrate: 192000
      channels: 2
  
  # Current quality preset
  quality: "high"  # low, medium, high, studio
  
  # Audio device management
  devices:
    auto_discover: true
    list_available: false
    default_input: null  # Use system default
    default_output: null  # Use system default
    fallback_to_default: true

# =========================
# AUDIO INPUT SETTINGS
# =========================

input:
  # Basic settings
  sample_rate: 16000
  channels: 1
  chunk_size: 2048
  format: "float32"  # Options: int16, int32, float32, float64
  
  # Device configuration
  device: null  # Use default device (null) or specify device ID/index
  device_name: null  # Specify device by name
  
  # Recording settings
  recording:
    max_duration: 300  # Maximum recording duration in seconds
    min_duration: 0.5  # Minimum recording duration in seconds
    idle_timeout: 30  # Idle timeout in seconds
    auto_stop: true  # Auto-stop on silence
  
  # Buffer management
  buffer:
    size: 4096  # Buffer size in bytes
    queue_size: 10  # Number of buffers to queue
    overflow_policy: "drop"  # Options: drop, block, raise
  
  # Hardware acceleration
  hardware_acceleration: false
  use_wasapi: false  # Windows Audio Session API
  use_pulseaudio: false  # Linux PulseAudio
  use_coreaudio: false  # macOS Core Audio

# =========================
# AUDIO OUTPUT SETTINGS
# =========================

output:
  # Basic settings
  sample_rate: 44100
  channels: 2
  format: "float32"
  
  # Device configuration
  device: null
  device_name: null
  
  # Playback settings
  playback:
    volume: 0.9  # Volume level (0.0 to 1.0)
    pan: 0.0  # Stereo pan (-1.0 left to 1.0 right)
    crossfade_ms: 10  # Crossfade duration in milliseconds
  
  # Buffer management
  buffer:
    size: 4096
    queue_size: 5
    low_latency: false  # Enable low-latency mode
  
  # Equalizer settings
  equalizer:
    enabled: false
    bands:
      - frequency: 60
        gain: 0
      - frequency: 230
        gain: 0
      - frequency: 910
        gain: 0
      - frequency: 4000
        gain: 0
      - frequency: 14000
        gain: 0

# =========================
# SPEECH RECOGNITION (STT)
# =========================

speech_recognition:
  # Engine selection
  engine: "google"  # Options: google, azure, wit, sphinx, whisper, local
  
  # Engine-specific configurations
  engines:
    google:
      api_key: null  # Set via environment variable GOOGLE_API_KEY
      language: "en-US"
      alternative_languages: []
      enable_profanity_filter: false
      enable_word_confidence: true
      enable_word_time_offsets: true
    
    azure:
      api_key: null
      region: "eastus"
      endpoint: null
      language: "en-US"
      profanity_filter: "masked"
      enable_dictation: false
      enable_speaker_diarization: true
      diarization_max_speakers: 2
    
    wit:
      api_key: null
      version: "20220515"
      language: "en-US"
      enable_sentiment: true
    
    whisper:
      model: "base"  # Options: tiny, base, small, medium, large
      device: "cpu"  # Options: cpu, cuda, mps
      compute_type: "int8"  # Options: int8, float16, float32
      language: "en"
      task: "transcribe"  # Options: transcribe, translate
      temperature: 0.0
      compression_ratio_threshold: 2.4
      logprob_threshold: -1.0
      no_speech_threshold: 0.6
    
    local:
      model_path: "models/speech_recognition"
      use_vosk: true
      use_pocketsphinx: false
      dictionary_path: null
      language_model_path: null
  
  # Common settings
  language: "en-US"
  model: "base"  # Model size/type
  confidence_threshold: 0.5  # Minimum confidence for accepting results
  enable_continuous: false  # Continuous recognition mode
  enable_partial_results: true  # Return partial results during recognition
  
  # Advanced settings
  adaptation:
    enable_adaptation: false  # Adapt to speaker's voice
    adaptation_duration: 30  # Adaptation duration in seconds
    adaptation_samples: 5  # Number of samples for adaptation
  
  # Noise handling
  noise_handling:
    enable_noise_suppression: true
    enable_echo_cancellation: true
    noise_floor_db: -50
    dynamic_threshold: true
  
  # Punctuation and formatting
  punctuation:
    enable_automatic_punctuation: true
    enable_capitalization: true
    custom_punctuation: [".", ",", "?", "!", ";", ":"]
  
  # Vocabulary
  vocabulary:
    custom_words: []
    boost_phrases: []
    enable_profanity_filter: false
    profanity_replacement: "***"
  
  # Performance
  performance:
    max_alternatives: 3  # Maximum alternative transcriptions
    timeout_seconds: 30  # Recognition timeout
    streaming_chunk_size: 0.2  # Seconds per chunk for streaming
    batch_size: 10  # Batch size for batch processing

# =========================
# TEXT-TO-SPEECH (TTS)
# =========================

text_to_speech:
  # Engine selection
  engine: "pyttsx3"  # Options: pyttsx3, gtts, azure, elevenlabs, coqui, edge
  
  # Engine-specific configurations
  engines:
    pyttsx3:
      voice: "default"  # Voice name or ID
      rate: 150  # Words per minute (50-300)
      volume: 0.9  # Volume level (0.0-1.0)
      language: "en-US"
    
    gtts:
      language: "en"
      slow: false
      tld: "com"  # Top-level domain for Google TTS
    
    azure:
      api_key: null
      region: "eastus"
      endpoint: null
      voice: "en-US-JennyNeural"
      style: "general"  # Options: general, cheerful, sad, angry, fearful
      style_degree: 1.0  # Style intensity (0.5-1.5)
      role: null  # Options: Girl, Boy, Man, Woman, Elderly
      pitch: "default"  # Voice pitch
      rate: "default"  # Speaking rate
      volume: "default"  # Volume level
    
    elevenlabs:
      api_key: null
      voice_id: "21m00Tcm4TlvDq8ikWAM"  # Default voice
      model_id: "eleven_monolingual_v1"
      stability: 0.5  # Voice stability (0-1)
      similarity_boost: 0.75  # Similarity boost (0-1)
      style: 0.0  # Style exaggeration (0-1)
      speaker_boost: true
    
    coqui:
      model_path: "models/tts"
      language: "en"
      speaker: null
      speed: 1.0
      temperature: 0.7
    
    edge:
      voice: "en-US-JennyNeural"
      rate: 0  # Rate adjustment (-100 to 100)
      pitch: 0  # Pitch adjustment (-100 to 100)
      volume: 0  # Volume adjustment (-100 to 100)
  
  # Common settings
  voice: "default"
  rate: 150  # Words per minute (50-300)
  volume: 0.9  # Volume level (0.0-1.0)
  language: "en-US"
  pitch: 1.0  # Pitch multiplier (0.5-2.0)
  
  # Voice profiles
  voice_profiles:
    default:
      name: "Default Voice"
      gender: "female"
      language: "en-US"
    male:
      name: "Male Voice"
      gender: "male"
      language: "en-US"
    female:
      name: "Female Voice"
      gender: "female"
      language: "en-US"
    child:
      name: "Child Voice"
      gender: "neutral"
      language: "en-US"
  
  # Speech customization
  customization:
    emphasis: 0.5  # Emphasis level (0-1)
    speaking_rate: 1.0  # Speaking rate multiplier
    pause_marks: true  # Add pauses at punctuation
    ssml_support: true  # Enable SSML markup support
  
  # Audio output
  output:
    format: "wav"  # Options: wav, mp3, ogg
    bitrate: 128000  # Bitrate in bps
    normalize_audio: true  # Normalize audio levels
  
  # Caching
  cache:
    enabled: true
    max_size_mb: 500  # Maximum cache size in MB
    ttl_seconds: 86400  # Cache TTL (24 hours)
    persist_to_disk: true
  
  # Streaming
  streaming:
    enabled: true
    chunk_size: 1024  # Bytes per chunk
    buffer_seconds: 1  # Buffer size in seconds

# =========================
# NOISE FILTERING
# =========================

noise_filter:
  # Master enable
  enabled: true
  
  # Filter settings
  threshold: 0.1  # Noise threshold (0-1)
  fft_size: 2048  # FFT window size
  hop_length: 512  # Hop length for STFT
  
  # Noise reduction algorithms
  algorithms:
    spectral_gating:
      enabled: true
      stationary: true
      time_constant_s: 2.0
      max_gain_db: 10
    
    wiener_filter:
      enabled: false
      noise_power: 0.1
    
    rnnoise:
      enabled: false
      model_path: "models/rnnoise"
  
  # Dynamic noise floor
  dynamic_floor:
    enabled: true
    adaptation_rate: 0.1
    min_noise_level: 0.01
    max_noise_level: 0.5
    update_interval_seconds: 5
  
  # Wind noise reduction
  wind_reduction:
    enabled: false
    threshold_frequency: 500  # Hz
    reduction_db: -12
  
  # Hiss reduction
  hiss_reduction:
    enabled: true
    threshold_frequency: 4000  # Hz
    reduction_db: -6
  
  # Speech enhancement
  speech_enhancement:
    enabled: true
    gain_target_db: -20
    compression_ratio: 2.0

# =========================
# WAKE WORD DETECTION
# =========================

wakeword:
  # Master enable
  enabled: true
  
  # Detection settings
  model: "hey_computer"  # Model name
  threshold: 0.5  # Detection threshold (0-1)
  sensitivity: 0.7  # Detection sensitivity (0-1)
  
  # Wake word models
  models:
    hey_computer:
      phrases: ["hey computer", "hello computer"]
      sensitivity: 0.7
      model_path: "models/wakeword/hey_computer.pb"
    
    hey_google:
      phrases: ["hey google", "ok google"]
      sensitivity: 0.6
      model_path: "models/wakeword/hey_google.pb"
    
    hey_siri:
      phrases: ["hey siri"]
      sensitivity: 0.65
      model_path: "models/wakeword/hey_siri.pb"
    
    alexa:
      phrases: ["alexa", "amazon"]
      sensitivity: 0.55
      model_path: "models/wakeword/alexa.pb"
    
    custom:
      phrases: ["custom wake word"]
      sensitivity: 0.7
      model_path: null  # Path to custom model
  
  # Custom wake word training
  custom_training:
    enabled: false
    phrases: []
    samples_per_phrase: 100
    negative_samples: 500
    epochs: 50
    learning_rate: 0.001
  
  # Detection parameters
  parameters:
    window_size_ms: 100  # Analysis window size
    hop_size_ms: 20  # Hop size between windows
    mel_bins: 40  # Number of mel filterbanks
    n_fft: 512  # FFT size
  
  # Post-processing
  post_processing:
    minimum_detection_interval: 1.0  # Seconds between detections
    debounce_frames: 3  # Number of frames to confirm detection
    use_vad: true  # Use VAD to filter non-speech
  
  # Performance
  performance:
    use_gpu: false
    batch_size: 1
    inference_threads: 1
  
  # Fallback
  fallback:
    enable_keyword_spotting: true
    keyword_list: ["computer", "assistant", "help"]
    simple_threshold: 0.3

# =========================
# VOICE ACTIVITY DETECTION (VAD)
# =========================

vad:
  # Master enable
  enabled: true
  
  # VAD mode
  mode: "webrtc"  # Options: webrtc, spectral, energy, hybrid
  
  # WebRTC VAD settings
  webrtc:
    aggressiveness: 1  # 0-3 (least to most aggressive)
    frame_size_ms: 30  # Frame size in milliseconds
    sample_rate: 16000
  
  # Spectral VAD settings
  spectral:
    threshold: 0.1
    smoothing_window: 5
    spectral_flux_threshold: 0.05
  
  # Energy-based VAD
  energy:
    energy_threshold: 0.01
    min_speech_duration_ms: 250
    min_silence_duration_ms: 500
  
  # Hybrid VAD
  hybrid:
    weights:
      webrtc: 0.6
      spectral: 0.2
      energy: 0.2
    decision_threshold: 0.5
  
  # Speech boundaries
  boundaries:
    padding_before_ms: 200  # Padding before speech
    padding_after_ms: 300  # Padding after speech
    merge_speech_gap_ms: 500  # Merge speech with gap less than this
  
  # Real-time processing
  realtime:
    enabled: true
    update_interval_ms: 100
    adaptive_threshold: true

# =========================
# ECHO CANCELLATION
# =========================

echo_cancellation:
  # Master enable
  enabled: true
  
  # Algorithm
  algorithm: "aecm"  # Options: aecm, webrtc, speex
  
  # WebRTC AEC
  webrtc:
    delay_ms: 50  # Echo path delay
    drift_compensation: true
    filter_length: 256
  
  # AECM (AEC Mobile)
  aecm:
    routing_mode: 1  # 0: Quiet, 1: Default, 2: Loud
    comfort_noise: true
  
  # Speex AEC
  speex:
    sampling_rate: 16000
    filter_length: 256
    suppression_level: 0  # 0-4 (least to most aggressive)
  
  # Post-processing
  post_processing:
    suppression_gain_db: -20
    residual_echo_suppression: true
  
  # Performance
  performance:
    use_threading: true
    buffer_size_ms: 200

# =========================
# AUDIO ENHANCEMENT
# =========================

audio_enhancement:
  # Master enable
  enabled: true
  
  # Gain control
  gain_control:
    enabled: true
    target_level_db: -20
    compression_gain_db: 10
    limiter_enabled: true
    analog_gain_control: false
  
  # Equalization
  equalization:
    enabled: false
    profile: "flat"  # Options: flat, bass_boost, treble_boost, vocal, custom
    
    profiles:
      flat: []
      bass_boost:
        - frequency: 60
          gain: 6
          q: 1.0
      treble_boost:
        - frequency: 10000
          gain: 6
          q: 1.0
      vocal:
        - frequency: 1000
          gain: 3
          q: 1.5
        - frequency: 3000
          gain: 2
          q: 1.5
  
  # Dynamics processing
  dynamics:
    compressor:
      enabled: false
      threshold_db: -12
      ratio: 3.0
      attack_ms: 5
      release_ms: 50
      knee_db: 6
    
    limiter:
      enabled: true
      threshold_db: -3
      release_ms: 100
  
  # Stereo widening
  stereo_widening:
    enabled: false
    width: 1.0  # 0=mono, 1=normal, 2=wide
  
  # Reverb removal
  reverb_removal:
    enabled: false
    strength: 0.5

# =========================
# AUDIO STREAMING
# =========================

streaming:
  # Master enable
  enabled: true
  
  # Protocols
  protocols: ["websocket", "rtp", "http"]  # Supported protocols
  
  # WebSocket settings
  websocket:
    url: "ws://localhost:8765/audio"
    ping_interval: 20
    ping_timeout: 10
    max_message_size: 1048576  # 1MB
  
  # RTP settings
  rtp:
    port: 5004
    payload_type: 96
    ssrc: 12345
    clock_rate: 16000
  
  # HTTP streaming
  http:
    endpoint: "/api/audio/stream"
    chunk_size: 8192
    buffer_size: 10
  
  # Stream management
  management:
    max_streams: 10
    stream_timeout_seconds: 300
    auto_reconnect: true
    heartbeat_interval: 30
  
  # Quality adaptation
  quality_adaptation:
    enabled: true
    adaptive_bitrate: true
    min_bitrate: 32000
    max_bitrate: 192000
    adjustment_interval: 5  # Seconds

# =========================
# AUDIO FILE MANAGEMENT
# =========================

file_management:
  # Storage paths
  paths:
    recordings: "audio_data/recordings"
    generated: "audio_data/generated"
    cache: "audio_data/cache"
    temp: "audio_data/temp"
  
  # Naming conventions
  naming:
    pattern: "{type}_{date}_{time}_{id}.{format}"
    date_format: "%Y%m%d"
    time_format: "%H%M%S"
  
  # Retention policies
  retention:
    recordings_days: 30
    generated_days: 7
    cache_days: 1
    temp_hours: 24
  
  # Compression
  compression:
    recordings: true
    generated: false
    compression_level: 6  # 0-9
  
  # Cleanup
  cleanup:
    enabled: true
    interval_hours: 24
    delete_empty_dirs: true

# =========================
# MONITORING & METRICS
# =========================

monitoring:
  # Metrics collection
  metrics:
    enabled: true
    collection_interval: 10  # Seconds
    
    track:
      - "audio_level"
      - "noise_level"
      - "recording_duration"
      - "speech_duration"
      - "vad_accuracy"
      - "stt_latency"
      - "tts_latency"
      - "cpu_usage"
      - "memory_usage"
  
  # Performance logging
  performance_logging:
    enabled: true
    log_interval: 60  # Seconds
    log_file: "logs/audio_performance.log"
  
  # Alerts
  alerts:
    enabled: true
    thresholds:
      high_noise_level: 0.7
      low_speech_quality: 0.3
      high_latency_ms: 1000
      high_cpu_percent: 80
      high_memory_mb: 1024

# =========================
# DEBUG & PROFILING
# =========================

debug:
  # Debug mode
  enabled: false
  
  # Verbose logging
  verbose_logging: false
  
  # Audio debugging
  audio_debug:
    save_processed_audio: false
    save_intermediate_steps: false
    debug_output_dir: "audio_data/debug"
  
  # Profiling
  profiling:
    enabled: false
    trace_calls: false
    save_flamegraphs: false
    profile_dir: "profiles/audio"
  
  # Diagnostic tools
  diagnostics:
    enabled: false
    run_on_startup: false
    test_audio_devices: true
    test_sample_rate: 16000
    test_duration: 2  # Seconds

# =========================
# INTEGRATION SETTINGS
# =========================

integration:
  # Home Assistant
  home_assistant:
    enabled: false
    url: null
    api_key: null
  
  # MQTT
  mqtt:
    enabled: false
    broker: "localhost"
    port: 1883
    topic_prefix: "audio"
  
  # REST API
  rest_api:
    enabled: true
    endpoint: "/api/audio"
    timeout_seconds: 30
    max_payload_mb: 10
  
  # Webhook notifications
  webhooks:
    enabled: false
    urls: []
    events: ["recording_complete", "wakeword_detected"]

# =========================
# FALLBACK & REDUNDANCY
# =========================

fallback:
  # Engine fallback chain
  stt_fallback: ["google", "azure", "local"]
  tts_fallback: ["pyttsx3", "gtts", "edge"]
  
  # Device fallback
  audio_device_fallback: true
  
  # Graceful degradation
  degradation:
    disable_noise_filter: false
    disable_vad: false
    reduce_sample_rate: true
    fallback_sample_rate: 8000